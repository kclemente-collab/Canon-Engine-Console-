name: FGE Recursive Development Proof
on:
  pull_request:
    paths:
      - 'fge_rd/**'
      - 'tests/test_engine.py'
      - '.github/workflows/fge-recursive-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deterministic gate tests
        run: python -m unittest discover -s tests -p test_engine.py -v
      - name: Negative fixture and receipt
        run: python -m fge_rd.engine
